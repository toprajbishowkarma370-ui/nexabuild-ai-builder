<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaBuild AI Builder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #6ea8ff;
    --success: #35c07a;
    --error: #ff5d5d;
    --loading: #ffb84d;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #141821, #0f1115);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  header h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 15px; line-height: 1.45;
    font-family: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

  button {
    flex: 1; min-width: 140px; padding: 14px 16px; font-size: 16px; font-weight: 600;
    border-radius: 10px; border: 1px solid transparent; cursor: pointer;
    transition: transform .05s ease, background .15s ease, opacity .15s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; }

  #generateBtn { background: var(--accent); color: #fff; }
  #generateBtn:hover:not(:disabled) { background: var(--accent-2); }

  #status {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; display: none; border: 1px solid transparent;
    word-break: break-word;
  }
  #status.loading { display: block; background: rgba(255,184,77,.08); border-color: rgba(255,184,77,.4); color: var(--loading); }
  #status.success { display: block; background: rgba(53,192,122,.08); border-color: rgba(53,192,122,.4); color: var(--success); }
  #status.error   { display: block; background: rgba(255,93,93,.08);  border-color: rgba(255,93,93,.4);  color: var(--error); }

  .preview-wrap { display: flex; flex-direction: column; gap: 8px; }
  .preview-head { display: flex; justify-content: space-between; align-items: center; }
  .preview-head h2 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }

  #preview {
    width: 100%; height: 60vh; min-height: 380px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
  }

  .hint { color: var(--muted); font-size: 12px; }

  footer { padding: 14px 16px 24px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> NexaBuild AI Builder</h1>
  <p>Describe a website. Generate it. Preview it live.</p>
</header>

<main>
  <section class="card">
    <label for="idea">Describe the website you want</label>
    <textarea id="idea" placeholder="e.g. A modern landing page for a coffee shop with a hero section, menu, and contact form."></textarea>

    <div class="actions">
      <button id="generateBtn" type="button">Generate</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <p class="hint" style="margin-top:8px;">If the server has no DeepSeek key configured, a demo site is returned instead.</p>
  </section>

  <section class="card preview-wrap">
    <div class="preview-head">
      <h2>Live preview</h2>
    </div>
    <iframe
      id="preview"
      title="Generated website preview"
      sandbox="allow-scripts allow-forms allow-popups allow-modals"
      referrerpolicy="no-referrer"
    ></iframe>
  </section>
</main>

<footer>NexaBuild AI Builder — API key is stored server-side only.</footer>

<script>
(function () {
  "use strict";

  var ideaEl    = document.getElementById("idea");
  var statusEl  = document.getElementById("status");
  var previewEl = document.getElementById("preview");
  var genBtn    = document.getElementById("generateBtn");

  if (!ideaEl || !statusEl || !previewEl || !genBtn) {
    console.error("NexaBuild wiring error: missing required elements");
    return;
  }

  function setStatus(message, kind) {
    statusEl.textContent = message || "";
    statusEl.className = kind || "";
  }

  function setLoading(isLoading) {
    genBtn.disabled = isLoading;
    genBtn.textContent = isLoading ? "Generating…" : "Generate";
  }

  function generate() {
    var idea = (ideaEl.value || "").trim();
    if (!idea) {
      setStatus("Please describe the website you want.", "error");
      ideaEl.focus();
      return;
    }

    setLoading(true);
    setStatus("Generating…", "loading");
    previewEl.srcdoc = "";

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: idea })
    })
      .then(function (res) {
        return res.text().then(function (raw) {
          var data = null;
          try { data = JSON.parse(raw); }
          catch (e) {
            throw new Error("Server returned non-JSON (HTTP " + res.status + ")");
          }
          if (!res.ok) {
            throw new Error((data && data.error) || ("Request failed: HTTP " + res.status));
          }
          if (!data || data.success !== true || typeof data.html !== "string" || !data.html) {
            throw new Error((data && data.error) || "API did not return HTML.");
          }
          return data.html;
        });
      })
      .then(function (html) {
        previewEl.srcdoc = html;
        setStatus("Done. Your website is ready below.", "success");
      })
      .catch(function (err) {
        setStatus("Error: " + (err && err.message ? err.message : String(err)), "error");
      })
      .finally(function () {
        setLoading(false);
      });
  }

  genBtn.addEventListener("click", generate);

  ideaEl.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      generate();
    }
  });
})();
</script>

</body>
</html>
