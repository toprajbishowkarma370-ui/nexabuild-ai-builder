<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaBuild AI Builder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #6ea8ff;
    --success: #35c07a;
    --error: #ff5d5d;
    --loading: #ffb84d;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #141821, #0f1115);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  header h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-size: 15px; line-height: 1.45;
    font-family: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

  button {
    flex: 1; min-width: 140px; padding: 13px 16px; font-size: 15px; font-weight: 600;
    border-radius: 10px; border: 1px solid transparent; cursor: pointer;
    transition: transform .05s ease, background .15s ease, opacity .15s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #generateBtn { background: var(--accent); color: #fff; }
  #generateBtn:hover:not(:disabled) { background: var(--accent-2); }

  #downloadBtn, #copyBtn {
    background: var(--panel-2); color: var(--text); border-color: var(--border);
  }
  #downloadBtn:hover:not(:disabled), #copyBtn:hover:not(:disabled) { background: #232834; }

  #status {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; display: none; border: 1px solid transparent;
    word-break: break-word;
  }
  #status.loading { display: block; background: rgba(255,184,77,.08); border-color: rgba(255,184,77,.4); color: var(--loading); }
  #status.success { display: block; background: rgba(53,192,122,.08); border-color: rgba(53,192,122,.4); color: var(--success); }
  #status.error   { display: block; background: rgba(255,93,93,.08);  border-color: rgba(255,93,93,.4);  color: var(--error); }

  .mode-row {
    display: flex; gap: 8px; margin-bottom: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px;
  }
  .mode-row label {
    flex: 1; margin: 0; padding: 8px 10px; border-radius: 8px;
    font-size: 14px; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    user-select: none;
  }
  .mode-row input { display: none; }
  .mode-row input:checked + span { color: var(--text); }
  .mode-row label:has(input:checked) {
    background: var(--accent); color: #fff;
  }
  .mode-row label:has(input:disabled) { opacity: .45; cursor: not-allowed; }

  .preview-wrap { display: flex; flex-direction: column; gap: 8px; }
  .preview-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .preview-head h2 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }

  #preview {
    width: 100%; height: 60vh; min-height: 380px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
  }

  footer { padding: 14px 16px 24px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> NexaBuild AI Builder</h1>
  <p>Create a new website, or edit the one you just generated.</p>
</header>

<main>
  <section class="card">
    <div class="mode-row" role="radiogroup" aria-label="Mode">
      <label>
        <input type="radio" name="mode" id="modeCreate" value="create" checked />
        <span>Create New</span>
      </label>
      <label id="editModeLabel">
        <input type="radio" name="mode" id="modeEdit" value="edit" disabled />
        <span>Edit Existing</span>
      </label>
    </div>

    <label for="prompt" id="promptLabel">Describe the new website you want</label>
    <textarea id="prompt" placeholder="e.g. A modern landing page for a coffee shop with a hero section, menu, and contact form."></textarea>

    <div class="actions">
      <button id="generateBtn" type="button">Generate</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="card preview-wrap">
    <div class="preview-head">
      <h2>Live preview</h2>
      <div class="actions" style="margin:0; flex: 0 0 auto; gap: 8px;">
        <button id="downloadBtn" type="button" disabled>Download Code</button>
        <button id="copyBtn" type="button" disabled>Copy Code</button>
      </div>
    </div>
    <iframe
      id="preview"
      title="Generated website preview"
      sandbox="allow-scripts allow-forms allow-popups allow-modals"
      referrerpolicy="no-referrer"
    ></iframe>
  </section>
</main>

<footer>NexaBuild AI Builder — API key is stored server-side only.</footer>

<script>
(function () {
  "use strict";

  var promptEl     = document.getElementById("prompt");
  var promptLabel  = document.getElementById("promptLabel");
  var statusEl     = document.getElementById("status");
  var previewEl    = document.getElementById("preview");
  var generateBtn  = document.getElementById("generateBtn");
  var downloadBtn  = document.getElementById("downloadBtn");
  var copyBtn      = document.getElementById("copyBtn");
  var modeCreate   = document.getElementById("modeCreate");
  var modeEdit     = document.getElementById("modeEdit");

  // Single source of truth for the latest generated or edited HTML.
  var currentHtml = "";

  function setStatus(message, kind) {
    statusEl.textContent = message || "";
    statusEl.className = kind || "";
  }

  function setLoading(isLoading) {
    generateBtn.disabled = isLoading;
    generateBtn.textContent = isLoading
      ? (modeEdit.checked ? "Editing…" : "Generating…")
      : (modeEdit.checked ? "Apply Edit" : "Generate");
  }

  function setButtonsEnabled(enabled) {
    downloadBtn.disabled = !enabled;
    copyBtn.disabled = !enabled;
  }

  function refreshModeUI() {
    var editing = modeEdit.checked;
    promptLabel.textContent = editing
      ? "Describe the change to apply to the current website"
      : "Describe the new website you want";
    promptEl.placeholder = editing
      ? "e.g. Change the header background to blue and add a contact section."
      : "e.g. A modern landing page for a coffee shop with a hero section, menu, and contact form.";
    generateBtn.textContent = editing ? "Apply Edit" : "Generate";
  }

  modeCreate.addEventListener("change", refreshModeUI);
  modeEdit.addEventListener("change", refreshModeUI);

  function generate() {
    var idea = (promptEl.value || "").trim();
    if (!idea) {
      setStatus("Please enter a prompt.", "error");
      promptEl.focus();
      return;
    }

    var editing = modeEdit.checked;
    if (editing && !currentHtml) {
      setStatus("Nothing to edit yet. Generate a website first.", "error");
      return;
    }

    setLoading(true);
    setStatus(editing ? "Applying edit…" : "Generating…", "loading");

    var body = editing
      ? { prompt: idea, currentHtml: currentHtml }
      : { prompt: idea };

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        return res.text().then(function (raw) {
          var data = null;
          try { data = JSON.parse(raw); }
          catch (e) {
            throw new Error("Server returned non-JSON (HTTP " + res.status + ")");
          }
          if (!res.ok) {
            throw new Error((data && data.error) || ("Request failed: HTTP " + res.status));
          }
          if (!data || data.success !== true || typeof data.html !== "string" || !data.html) {
            throw new Error((data && data.error) || "API did not return HTML.");
          }
          return data.html;
        });
      })
      .then(function (html) {
        currentHtml = html;
        previewEl.srcdoc = currentHtml;
        setButtonsEnabled(true);
        modeEdit.disabled = false;
        setStatus(
          editing
            ? "Edit applied. Preview updated below."
            : "Done. Your website is ready below.",
          "success"
        );
      })
      .catch(function (err) {
        setStatus("Error: " + (err && err.message ? err.message : String(err)), "error");
      })
      .finally(function () {
        setLoading(false);
      });
  }

  generateBtn.addEventListener("click", generate);

  promptEl.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      generate();
    }
  });

  downloadBtn.addEventListener("click", function () {
    if (!currentHtml) {
      setStatus("Nothing to download yet.", "error");
      return;
    }
    try {
      var blob = new Blob([currentHtml], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "nexabuild-website.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus("Downloaded nexabuild-website.html", "success");
    } catch (err) {
      setStatus("Download failed: " + (err && err.message ? err.message : String(err)), "error");
    }
  });

  copyBtn.addEventListener("click", function () {
    if (!currentHtml) {
      setStatus("Nothing to copy yet.", "error");
      return;
    }

    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(currentHtml)
        .then(function () { setStatus("Code copied to clipboard.", "success"); })
        .catch(function () {
          if (fallbackCopy(currentHtml)) {
            setStatus("Code copied to clipboard.", "success");
          } else {
            setStatus("Copy failed. Your browser blocked clipboard access.", "error");
          }
        });
    } else if (fallbackCopy(currentHtml)) {
      setStatus("Code copied to clipboard.", "success");
    } else {
      setStatus("Copy failed. Your browser blocked clipboard access.", "error");
    }
  });

  refreshModeUI();
})();
</script>

</body>
</html>
