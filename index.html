<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaBuild AI Builder</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #9aa3b2; --accent: #4f8cff; --accent-2: #6ea8ff;
    --success: #35c07a; --error: #ff5d5d; --loading: #ffb84d; --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px; border-bottom: 1px solid var(--border); background: #141821; }
  header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  header h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  textarea { width: 100%; min-height: 110px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 15px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  button { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 10px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { background: var(--accent-2); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 12px; padding: 10px; border-radius: 10px; font-size: 14px; display: none; }
  #status.loading { display: block; background: rgba(255,184,77,.1); color: var(--loading); border: 1px solid rgba(255,184,77,.3); }
  #status.success { display: block; background: rgba(53,192,122,.1); color: var(--success); border: 1px solid rgba(53,192,122,.3); }
  #status.error { display: block; background: rgba(255,93,93,.1); color: var(--error); border: 1px solid rgba(255,93,93,.3); }
  #preview { width: 100%; height: 60vh; min-height: 380px; background: #fff; border: 1px solid var(--border); border-radius: 10px; }
  footer { padding: 14px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span> NexaBuild AI Builder</h1>
</header>
<main>
  <section class="card">
    <textarea id="idea" placeholder="Describe the website you want..."></textarea>
    <button id="generateBtn" type="button">Generate</button>
    <div id="status"></div>
  </section>
  <section class="card">
    <h2>Live preview</h2>
    <iframe id="preview" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
  </section>
</main>
<footer>NexaBuild AI Builder</footer>
<script>
(function () {
  var ideaEl = document.getElementById("idea");
  var statusEl = document.getElementById("status");
  var previewEl = document.getElementById("preview");
  var genBtn = document.getElementById("generateBtn");

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = kind || "";
  }

  genBtn.addEventListener("click", function() {
    var idea = ideaEl.value.trim();
    if (!idea) { setStatus("Please enter a prompt.", "error"); return; }

    genBtn.disabled = true;
    genBtn.textContent = "Generating...";
    setStatus("Generating website...", "loading");
    previewEl.srcdoc = "";

    fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: idea })
    })
    .then(function(res) {
      return res.json().then(function(data) {
        if (!res.ok) throw new Error(data.error || "Server error: " + res.status);
        
        // Find HTML from any possible response structure (data.html or data.choices)
        var html = data.html || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content);
        
        if (!html) throw new Error("API did not return HTML.");
        return html;
      });
    })
    .then(function(html) {
      previewEl.srcdoc = html;
      setStatus("Website generated successfully!", "success");
    })
    .catch(function(err) {
      setStatus("Error: " + err.message, "error");
    })
    .finally(function() {
      genBtn.disabled = false;
      genBtn.textContent = "Generate";
    });
  });
})();
</script>
</body>
</html>
